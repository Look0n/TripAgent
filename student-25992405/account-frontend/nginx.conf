server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # IMPORTANT:
    # Keep redirects relative so the browser preserves :3000
    absolute_redirect off;


    # =================================================
    # ACCOUNT ROOT
    # =================================================

    location = / {
        return 302 /account;
    }

    location = /account {
        return 302 /account/profile;
    }


    # =================================================
    # ACCOUNT PAGES
    # =================================================

    location = /account/login {
        try_files /login.html =404;
    }

    location = /account/register {
        try_files /register.html =404;
    }

    location = /account/profile {
        try_files /profile.html =404;
    }

    location = /account/preferences {
        try_files /preference.html =404;
    }


    # =================================================
    # STATIC FILES
    # =================================================

    location /account/css/ {
        alias /usr/share/nginx/html/css/;
    }


    # =================================================
    # API
    # =================================================

    location /api/ {
        proxy_pass http://shared-gateway:5000;

        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}