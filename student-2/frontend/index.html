<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attractions & Tour Experiences</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2>🎪 Attractions & Tour Experiences</h2>

        <!-- Блок поиска -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search by name, city or description...">
            <button onclick="fetchAttractions()">Search</button>
        </div>

        <!-- Форма добавления (CRUD Create) -->
        <details style="margin-bottom: 20px;">
            <summary><strong>+ Add New Attraction (CRUD Create)</strong></summary>
            <form id="addForm" onsubmit="createAttraction(event)" style="margin-top: 10px; display: grid; gap: 10px;">
                <input type="text" id="addName" placeholder="Attraction Name" required>
                <input type="text" id="addCategory" placeholder="Category (e.g. Wildlife, Nature)" required>
                <input type="text" id="addCity" placeholder="City" required>
                <input type="number" step="0.1" id="addPrice" placeholder="Price ($)" required>
                <textarea id="addDesc" placeholder="Description"></textarea>
                <button type="submit" class="btn-success">Save Attraction</button>
            </form>
        </details>

        <!-- Заготовка под будущий ИИ (AI Recommendations Feature) -->
        <div class="ai-section">
            <h3>🤖 AI Attraction Recommendations (Planned Feature)</h3>
            <button onclick="getAIRecommendations()">Get AI Recommendations</button>
            <div id="aiResults"></div>
        </div>

        <hr style="margin: 20px 0; border: none; border-top: 1px solid #ddd;">

        <!-- Список мест -->
        <div id="attractionsList">Loading attractions...</div>
    </div>

    <script>
        const API_URL = 'http://localhost:5002/api/attractions';

        // 1. GET ALL / SEARCH
        async function fetchAttractions() {
            const query = document.getElementById('searchInput').value;
            const res = await fetch(`${API_URL}?search=${encodeURIComponent(query)}`);
            const data = await res.json();
            
            const listDiv = document.getElementById('attractionsList');
            listDiv.innerHTML = '';

            if (data.length === 0) {
                listDiv.innerHTML = '<p>No attractions found.</p>';
                return;
            }

            data.forEach(item => {
                listDiv.innerHTML += `
                    <div class="card">
                        <h3>${item.name} <span class="badge">${item.category}</span></h3>
                        <p><strong>City:</strong> ${item.city} | <span class="price">$${item.price}</span> | Rating: ⭐ ${item.average_rating}</p>
                        <p>${item.description}</p>
                        <button onclick="viewDetails(${item.attraction_id})">View Details & Reviews</button>
                        <button class="btn-danger" onclick="deleteAttraction(${item.attraction_id})">Delete</button>
                        <div id="details-${item.attraction_id}"></div>
                    </div>
                `;
            });
        }

        // 2. GET SINGLE DETAILS
        async function viewDetails(id) {
            const res = await fetch(`${API_URL}/${id}`);
            const data = await res.json();
            const detailDiv = document.getElementById(`details-${id}`);
            
            let reviewsHtml = data.reviews.map(r => `<li>⭐ ${r.rating_score}/5: "${r.comment}"</li>`).join('');
            
            detailDiv.innerHTML = `
                <div class="details-box">
                    <h4>Reviews & Extra Info</h4>
                    <ul>${reviewsHtml || 'No reviews yet.'}</ul>
                </div>
            `;
        }

        // 3. CREATE ATTRACTION
        async function createAttraction(e) {
            e.preventDefault();
            const body = {
                name: document.getElementById('addName').value,
                category: document.getElementById('addCategory').value,
                city: document.getElementById('addCity').value,
                price: parseFloat(document.getElementById('addPrice').value),
                description: document.getElementById('addDesc').value
            };

            await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            document.getElementById('addForm').reset();
            fetchAttractions();
        }

        // 4. DELETE ATTRACTION
        async function deleteAttraction(id) {
            if (confirm('Are you sure you want to delete this attraction?')) {
                await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                fetchAttractions();
            }
        }

        // 5. FUTURE AI METHOD CALL
        async function getAIRecommendations() {
            const aiDiv = document.getElementById('aiResults');
            aiDiv.innerHTML = '<em>Consulting AI Agent...</em>';
            
            try {
                const res = await fetch('http://localhost:5002/api/attractions/recommend', { method: 'POST' });
                const data = await res.json();
                aiDiv.innerHTML = `<p><strong>[Status]:</strong> ${data.note}</p>`;
            } catch (err) {
                aiDiv.innerHTML = '<p>Error calling AI service.</p>';
            }
        }

        // Run on page load
        fetchAttractions();
    </script>
</body>
</html>
