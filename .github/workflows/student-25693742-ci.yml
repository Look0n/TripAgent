name: Attractions Service CI

on:
  push:
    branches:
      - main
    paths:
      # Release 1: trigger CI when shared MCP/RAG integration files are updated
      - "student-25693742/**"
      - "shared/mcp-server/**"
      - "shared/rag-server/**"
      # Release 2: shared Multi-Agent Server (attractions prompts live here)
      - "shared/multi-agent-server/**"
      - "docker-compose.yml"
      - ".github/workflows/student-25693742-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      # Release 1: trigger CI when shared MCP/RAG integration files are updated
      - "student-25693742/**"
      - "shared/mcp-server/**"
      - "shared/rag-server/**"
      # Release 2: shared Multi-Agent Server (attractions prompts live here)
      - "shared/multi-agent-server/**"
      - "docker-compose.yml"
      - ".github/workflows/student-25693742-ci.yml"

  workflow_dispatch:


jobs:
  attractions-service-ci:
    name: Test Attractions Service
    runs-on: ubuntu-latest

    # Release 2 CI: keep AI-Mode, MCP, RAG and Multi-Agent integrated in the
    # code but disabled/locked, matching the cloud baseline.
    env:
      AI_MODE_ENABLED: "false"
      MCP_ENABLED: "false"
      RAG_ENABLED: "false"
      MULTI_AGENT_LOCKED: "true"

    steps:

      # ---------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ---------------------------------------------------
      # 2. Set up Python
      # ---------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ---------------------------------------------------
      # 3. Check Python syntax
      # ---------------------------------------------------

      - name: Check backend Python syntax
        run: |
          python -m compileall student-25693742/attractions-backend

      - name: Check database Python syntax
        run: |
          python -m compileall student-25693742/attractions-database


      # ---------------------------------------------------
      # 3b. Release 2 post-commit endpoint tests
      #     Endpoint function 1: GET  /api/attractions (list/search)
      #     Endpoint function 2: POST /api/attractions (create)
      #     plus Multi-Agent route tests (database and server stubbed)
      # ---------------------------------------------------

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r student-25693742/attractions-backend/requirements.txt

      - name: Run post-commit endpoint tests
        working-directory: student-25693742/attractions-backend
        run: |
          python -m pytest tests/test_endpoint_functions.py \
            tests/test_multi_agent_routes.py tests/test_ai_mode.py \
            -v -p no:cacheprovider --junitxml=endpoint-test-results.xml

      - name: Upload endpoint test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-25693742-endpoint-tests
          path: student-25693742/attractions-backend/endpoint-test-results.xml
          if-no-files-found: warn


      # ---------------------------------------------------
      # 4. Validate Docker Compose
      # ---------------------------------------------------

      - name: Validate Docker Compose
        run: |
          docker compose config


      # ---------------------------------------------------
      # 5. Build Attractions containers
      # ---------------------------------------------------

      - name: Build Attractions services
        run: |
          docker compose build \
            attractions-database \
            attractions-backend \
            attractions-frontend


      # ---------------------------------------------------
      # 6. Start Attractions services
      # ---------------------------------------------------

      - name: Start Attractions services
        run: |
          docker compose up -d \
            attractions-database \
            attractions-backend \
            attractions-frontend


      # ---------------------------------------------------
      # 7. Show container status
      # ---------------------------------------------------

      - name: Show Docker containers
        run: |
          docker compose ps


      # ---------------------------------------------------
      # 8. Wait for database
      # ---------------------------------------------------

      - name: Wait for Attractions Database
        run: |
          for i in {1..30}; do

            if curl --fail --silent http://localhost:6003/health; then
              echo ""
              echo "Attractions database is healthy."
              exit 0
            fi

            echo "Waiting for attractions database..."
            sleep 2

          done

          echo "Attractions database failed to become healthy."
          docker compose logs attractions-database
          exit 1


      # ---------------------------------------------------
      # 9. Wait for backend
      # ---------------------------------------------------

      - name: Wait for Attractions Backend
        run: |
          for i in {1..30}; do

            if curl --fail --silent http://localhost:5003/health; then
              echo ""
              echo "Attractions backend is healthy."
              exit 0
            fi

            echo "Waiting for attractions backend..."
            sleep 2

          done

          echo "Attractions backend failed to become healthy."
          docker compose logs attractions-backend
          exit 1


      # ---------------------------------------------------
      # 9b. Verify Release 2 CI / cloud baseline configuration
      # ---------------------------------------------------

      - name: Verify MCP and RAG are disabled in CI
        run: |
          MCP_VALUE=$(docker compose exec -T attractions-backend \
            printenv MCP_ENABLED)

          RAG_VALUE=$(docker compose exec -T attractions-backend \
            printenv RAG_ENABLED)

          echo "MCP_ENABLED=$MCP_VALUE"
          echo "RAG_ENABLED=$RAG_VALUE"

          test "$MCP_VALUE" = "false"
          test "$RAG_VALUE" = "false"

          echo "MCP and RAG are correctly disabled for CI"

      - name: Verify AI-Mode, MCP, RAG and Multi-Agent are off
        run: |
          MODES=$(curl -sf http://localhost:5003/api/attractions/modes)
          echo "Service modes: $MODES"

          echo "$MODES" | python -c "import json,sys; d=json.load(sys.stdin); sys.exit(0 if not (d['ai_mode'] or d['mcp'] or d['rag'] or d['multi_agent']) and d['multi_agent_locked'] else 1)"

          expect_403() {
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X "$1" \
              "http://localhost:5003$2" \
              -H "Content-Type: application/json" -d "$3")
            echo "$1 $2 -> $STATUS"
            test "$STATUS" = "403"
          }

          expect_403 POST /api/attractions/recommend '{"message":"museum in Paris"}'
          expect_403 POST /api/attractions/mcp/top-rated '{"city":"Paris"}'
          expect_403 POST /api/attractions/rag '{"question":"What categories exist?"}'
          expect_403 PUT /api/attractions/multi-agent/mode '{"enabled":true}'
          expect_403 POST /api/attractions/multi-agent/workflow '{"user_request":"A museum in Paris"}'

          echo "AI services are integrated but disabled/locked, as in the cloud baseline"


      # ---------------------------------------------------
      # 10. Check frontend
      # ---------------------------------------------------

      - name: Check Attractions Frontend
        run: |
          curl --fail http://localhost:3003/attractions/


      # ---------------------------------------------------
      # 11. Verify seed data
      # ---------------------------------------------------

      - name: Verify database seed records
        run: |
          ATTRACTION_COUNT=$(docker compose exec -T attractions-database \
            python -c "import sqlite3; conn=sqlite3.connect('/data/attractions.db'); print(conn.execute('SELECT COUNT(*) FROM attractions').fetchone()[0])")

          echo "Attraction records: $ATTRACTION_COUNT"

          if [ "$ATTRACTION_COUNT" -lt 10 ]; then
            echo "Expected at least 10 attraction records."
            exit 1
          fi


      # ---------------------------------------------------
      # 12. Test Attractions API
      # ---------------------------------------------------

      - name: Test get all attractions
        run: |
          curl --fail \
            http://localhost:5003/api/attractions

      - name: Test attraction by ID
        run: |
          curl --fail \
            http://localhost:5003/api/attractions/1

      - name: Test attraction search
        run: |
          curl --fail \
            "http://localhost:5003/api/attractions?city=Paris"

      - name: Live test of the two endpoint functions (list + create)
        run: |
          echo "Endpoint 1: GET /api/attractions?city=Paris"
          COUNT=$(curl -sf "http://localhost:5003/api/attractions?city=Paris" \
            | python -c "import json,sys; d=json.load(sys.stdin); assert all(a['city']=='Paris' for a in d); print(len(d))")
          echo "Paris attractions: $COUNT"
          test "$COUNT" -ge 1

          echo "Endpoint 2: POST /api/attractions"
          CREATED=$(curl -sf -X POST http://localhost:5003/api/attractions \
            -H "Content-Type: application/json" \
            -d '{"name":"CI Harbour Kayak Tour","category":"Adventure","city":"Sydney","price":60,"description":"Created by CI"}')
          echo "Created: $CREATED"
          NEW_ID=$(echo "$CREATED" | python -c "import json,sys; print(json.load(sys.stdin)['attraction_id'])")

          curl -sf "http://localhost:5003/api/attractions/$NEW_ID" \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d['name']=='CI Harbour Kayak Tour'"

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:5003/api/attractions \
            -H "Content-Type: application/json" -d '{"name":"Missing fields"}')
          echo "Invalid create -> $STATUS"
          test "$STATUS" = "400"

          curl -sf -X DELETE "http://localhost:5003/api/attractions/$NEW_ID"
          echo "Both endpoint functions validated against the running services"


      # ---------------------------------------------------
      # 13. Install pytest dependencies
      # ---------------------------------------------------

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r student-25693742/attractions-backend/requirements.txt

      # ---------------------------------------------------
      # 14. Run pytest
      # ---------------------------------------------------

      - name: Run Attractions pytest
        working-directory: student-25693742/attractions-backend
        env:
          DATABASE_API_URL: http://localhost:6003
        run: |
          pytest -v


      # ---------------------------------------------------
      # 15. Display logs if something failed
      # ---------------------------------------------------

      - name: Show Docker logs on failure
        if: failure()
        run: |
          docker compose logs attractions-database
          docker compose logs attractions-backend
          docker compose logs attractions-frontend


      # ---------------------------------------------------
      # 16. Clean up
      # ---------------------------------------------------

      - name: Stop Attractions services
        if: always()
        run: |
          docker compose down -v
