name: Pre-Trip Checklist Release 2 CI

on:
  push:
    paths:
      - "student-14582668/**"
      - "shared/multi-agent-server/**"
      - "shared/mcp-server/**"
      - "shared/rag-server/**"
      - "docker-compose.yml"
      - ".github/workflows/student-14582668-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "student-14582668/**"
      - "shared/multi-agent-server/**"
      - "shared/mcp-server/**"
      - "shared/rag-server/**"
      - "docker-compose.yml"
      - ".github/workflows/student-14582668-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  checklist-service-ci:
    name: Test Pre-Trip Checklist Service
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    env:
      MCP_ENABLED: "false"
      RAG_ENABLED: "false"
      MCP_LOCKED: "true"
      RAG_LOCKED: "true"
      MULTI_AGENT_LOCKED: "true"
      OLLAMA_DEFAULT_MODEL: qwen2.5:0.5b
      CHECKLIST_NETWORK: checklist-ci-network
      DATABASE_CONTAINER: checklist-database-ci
      BACKEND_CONTAINER: checklist-backend-ci
      FRONTEND_CONTAINER: checklist-frontend-ci

    steps:
      # ---------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------
      # 2. Set up Python
      # ---------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            student-14582668/checklist-backend/requirements.txt
            student-14582668/checklist-database/requirements.txt
            student-14582668/checklist-frontend/requirements.txt

      # ---------------------------------------------------
      # 3. Check Python syntax
      # ---------------------------------------------------
      - name: Check Checklist Python syntax
        run: |
          python -m compileall -q student-14582668/checklist-database
          python -m compileall -q student-14582668/checklist-backend
          python -m compileall -q student-14582668/checklist-frontend
          python -m compileall -q shared/multi-agent-server

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Checklist JavaScript syntax
        run: |
          node --check student-14582668/checklist-frontend/static/js/checklist.js
          node --check student-14582668/checklist-frontend/static/js/multi_agent.js

      # ---------------------------------------------------
      # 4. Run backend unit tests
      # ---------------------------------------------------
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r student-14582668/checklist-backend/requirements.txt

      # Required Release 2 endpoint functions:
      # POST /api/checklist-items/multi-agent/workflow -> start_workflow
      # POST /api/checklist-items/multi-agent/workflow/<uuid>/review -> review_workflow
      # Tests use mocked dependencies; no local AI server is required on the runner.
      - name: Test Release 2 workflow creation and human review endpoints
        working-directory: student-14582668/checklist-backend
        run: |
          python -m pytest tests/test_multi_agent_routes.py -v -p no:cacheprovider \
            --junitxml="$RUNNER_TEMP/checklist-release2-endpoints.xml" \
            | tee "$RUNNER_TEMP/checklist-release2-endpoints.log"

      - name: Run Checklist regression tests
        working-directory: student-14582668/checklist-backend
        run: |
          python -m pytest tests -v -p no:cacheprovider \
            --ignore=tests/test_multi_agent_routes.py \
            --junitxml="$RUNNER_TEMP/checklist-regression.xml" \
            | tee "$RUNNER_TEMP/checklist-regression.log"

      - name: Upload Checklist test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-14582668-release2-tests
          path: |
            ${{ runner.temp }}/checklist-release2-endpoints.xml
            ${{ runner.temp }}/checklist-release2-endpoints.log
            ${{ runner.temp }}/checklist-regression.xml
            ${{ runner.temp }}/checklist-regression.log
          if-no-files-found: warn

      # ---------------------------------------------------
      # 5. Validate the shared Docker Compose file
      # ---------------------------------------------------
      - name: Validate Docker Compose
        run: |
          docker compose config --quiet

      # ---------------------------------------------------
      # 6. Build Checklist container images
      # ---------------------------------------------------
      - name: Build Checklist services
        run: |
          docker build \
            -t checklist-database-ci \
            student-14582668/checklist-database

          docker build \
            -t checklist-backend-ci \
            student-14582668/checklist-backend

          docker build \
            -t checklist-frontend-ci \
            student-14582668/checklist-frontend

      # ---------------------------------------------------
      # 7. Create an isolated Checklist network
      # ---------------------------------------------------
      - name: Create Checklist Docker network
        run: |
          docker network create "$CHECKLIST_NETWORK"

      # ---------------------------------------------------
      # 8. Start and verify the database
      # ---------------------------------------------------
      - name: Start Checklist database
        run: |
          docker run -d \
            --name "$DATABASE_CONTAINER" \
            --network "$CHECKLIST_NETWORK" \
            -p 6004:6004 \
            checklist-database-ci

      - name: Wait for Checklist database
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:6004/health; then
              echo ""
              echo "Checklist database is healthy."
              exit 0
            fi

            echo "Waiting for Checklist database..."
            sleep 2
          done

          echo "Checklist database failed to become healthy."
          docker logs "$DATABASE_CONTAINER"
          exit 1
      
      - name: Verify Checklist seed records
        run: |
          CHECKLIST_COUNT=$(
            curl --fail --silent http://localhost:6004/checklist-items \
              | python -c "import json, sys; print(len(json.load(sys.stdin)))"
          )

          echo "Checklist seed records: $CHECKLIST_COUNT"

          if [ "$CHECKLIST_COUNT" -lt 10 ]; then
            echo "Expected at least 10 checklist records."
            exit 1
          fi

      # ---------------------------------------------------
      # 9. Start and verify the backend
      # ---------------------------------------------------
      - name: Start Checklist backend
        run: |
          docker run -d \
            --name "$BACKEND_CONTAINER" \
            --network "$CHECKLIST_NETWORK" \
            -p 5004:5004 \
            -e CHECKLIST_DATABASE_URL="http://$DATABASE_CONTAINER:6004" \
            -e MCP_ENABLED=false \
            -e RAG_ENABLED=false \
            -e MCP_LOCKED=true \
            -e RAG_LOCKED=true \
            -e MULTI_AGENT_LOCKED=true \
            -e OLLAMA_URL="http://127.0.0.1:11434/api/generate" \
            -e OLLAMA_MODEL="$OLLAMA_DEFAULT_MODEL" \
            checklist-backend-ci

      - name: Wait for Checklist backend
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:5004/health; then
              echo ""
              echo "Checklist backend is healthy."
              exit 0
            fi

            echo "Waiting for Checklist backend..."
            sleep 2
          done

          echo "Checklist backend failed to become healthy."
          docker logs "$BACKEND_CONTAINER"
          exit 1

      - name: Verify MCP RAG and Multi-Agent are disabled
        run: |
          docker exec -i "$BACKEND_CONTAINER" python - <<'PY'
          import requests

          base = "http://localhost:5004/api/checklist-items"

          for mode in ("mcp", "rag", "multi-agent"):
              response = requests.get(
                  f"{base}/{mode}/status",
                  timeout=5,
              )
              assert response.status_code == 200, response.text
              payload = response.json()
              assert payload["enabled"] is False, payload
              assert payload["available"] is False, payload

              response = requests.get(f"{base}/{mode}/mode", timeout=5)
              assert response.status_code == 200, response.text
              assert response.json() == {"enabled": False, "locked": True}
              response = requests.post(
                  f"{base}/{mode}/mode", json={"enabled": True}, timeout=5,
              )
              assert response.status_code == 403, response.text

          checks = [
              ("/mcp/call", {
                  "tool": "get_checklist_summary",
                  "arguments": {},
              }),
              ("/rag/refresh", {}),
              ("/rag/retrieve", {"query": "Checklist priority"}),
              ("/rag/answer", {"query": "Checklist priority"}),
              ("/multi-agent/workflow", {"user_request": "Review my checklist"}),
              ("/multi-agent/workflow/bdea8522-da18-408a-9bce-1641e7cdbf67/review", {
                  "decision": "Accept",
              }),
              ("/multi-agent/mode", {"enabled": True}),
          ]

          for path, payload in checks:
              response = requests.post(
                  base + path,
                  json=payload,
                  timeout=5,
              )
              assert response.status_code == 403, (
                  path, response.status_code, response.text
              )

          response = requests.get(f"{base}/multi-agent/mode", timeout=5)
          assert response.status_code == 200, response.text
          assert response.json() == {"enabled": False, "locked": True}

          response = requests.get(
              f"{base}/multi-agent/workflow/bdea8522-da18-408a-9bce-1641e7cdbf67",
              timeout=5,
          )
          assert response.status_code == 403, response.text

          print("PASS: MCP, RAG and Multi-Agent are disabled; Multi-Agent is locked.")
          # AI recommendation has no OFF gate yet. Its validation test below
          # does not prove the specification's complete cloud AI-disabled baseline.
          PY

      # ---------------------------------------------------
      # 10. Start and verify the frontend
      # ---------------------------------------------------
      - name: Start Checklist frontend
        run: |
          docker run -d \
            --name "$FRONTEND_CONTAINER" \
            --network "$CHECKLIST_NETWORK" \
            -p 3004:3004 \
            -e CHECKLIST_API_URL="http://localhost:5004/api/checklist-items" \
            checklist-frontend-ci

      - name: Wait for Checklist frontend
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:3004/health; then
              echo ""
              echo "Checklist frontend is healthy."
              exit 0
            fi

            echo "Waiting for Checklist frontend..."
            sleep 2
          done

          echo "Checklist frontend failed to become healthy."
          docker logs "$FRONTEND_CONTAINER"
          exit 1

      - name: Verify Checklist frontend page
        run: |
          curl --fail --silent http://localhost:3004/ > "$RUNNER_TEMP/checklist-page.html"
          grep --quiet "Pre-Trip Checklist" "$RUNNER_TEMP/checklist-page.html"
          grep --quiet 'id="multi-agent-toggle"' "$RUNNER_TEMP/checklist-page.html"
          grep --quiet 'id="mcp-toggle"' "$RUNNER_TEMP/checklist-page.html"
          grep --quiet 'id="rag-toggle"' "$RUNNER_TEMP/checklist-page.html"
          grep --quiet 'id="multi-agent-review-form"' "$RUNNER_TEMP/checklist-page.html"
          curl --fail --silent http://localhost:3004/static/js/multi_agent.js \
            > "$RUNNER_TEMP/checklist-multi-agent.js"
          node --check "$RUNNER_TEMP/checklist-multi-agent.js"

      # ---------------------------------------------------
      # 11. Run API smoke tests
      # ---------------------------------------------------
      - name: Test Checklist read and filters
        run: |
          curl --fail --silent \
            http://localhost:5004/api/checklist-items

          curl --fail --silent \
            "http://localhost:5004/api/checklist-items?item_type=packing"

          curl --fail --silent \
            http://localhost:5004/api/checklist-items/1

      - name: Test Checklist create update and delete
        run: |
          CREATED_ITEM=$(
            curl --fail --silent \
              -X POST \
              -H "Content-Type: application/json" \
              -d '{"title":"CI Test Item","item_type":"task","category":"Testing","description":"Created by GitHub Actions","priority":"Low","is_completed":false}' \
              http://localhost:5004/api/checklist-items
          )

          ITEM_ID=$(
            printf '%s' "$CREATED_ITEM" \
              | python -c "import json, sys; print(json.load(sys.stdin)['item_id'])"
          )

          echo "Created checklist item: $ITEM_ID"

          curl --fail --silent \
            -X PUT \
            -H "Content-Type: application/json" \
            -d '{"title":"Updated CI Test Item","is_completed":true}' \
            "http://localhost:5004/api/checklist-items/$ITEM_ID" \
            | grep --quiet 'Updated CI Test Item'

          curl --fail --silent \
            -X DELETE \
            "http://localhost:5004/api/checklist-items/$ITEM_ID" \
            | grep --quiet 'deleted successfully'

      - name: Test AI endpoint validation
        run: |
          STATUS_CODE=$(
            curl --silent \
              --output /tmp/checklist-ai-response.json \
              --write-out "%{http_code}" \
              -X POST \
              -H "Content-Type: application/json" \
              -d '{}' \
              http://localhost:5004/api/checklist-items/recommend
          )

          cat /tmp/checklist-ai-response.json

          if [ "$STATUS_CODE" != "400" ]; then
            echo "Expected HTTP 400 for an empty AI request."
            exit 1
          fi

      # ---------------------------------------------------
      # 12. Show status and failure logs
      # ---------------------------------------------------
      - name: Show Checklist container status
        run: |
          docker ps --filter "name=checklist-" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

      - name: Collect Checklist container logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/checklist-container-logs"
          for container in "$DATABASE_CONTAINER" "$BACKEND_CONTAINER" "$FRONTEND_CONTAINER"; do
            if docker inspect "$container" > /dev/null 2>&1; then
              docker logs "$container" > "$RUNNER_TEMP/checklist-container-logs/$container.log" 2>&1
            fi
          done

      - name: Upload Checklist container logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-14582668-release2-container-logs
          path: ${{ runner.temp }}/checklist-container-logs/
          if-no-files-found: warn

      - name: Write Release 2 evidence summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Checklist Release 2 validation
          - Endpoint 1: `POST /api/checklist-items/multi-agent/workflow` (`start_workflow`).
          - Endpoint 2: `POST /api/checklist-items/multi-agent/workflow/<uuid>/review` (`review_workflow`).
          - Endpoint tests mock dependencies; results do not demonstrate real model inference.
          - JUnit results and pytest logs: `student-14582668-release2-tests` artifact.
          - Container logs: `student-14582668-release2-container-logs` artifact.
          - Separate evidence is required for local pre-commit scans, real Multi-Agent execution,
            agentic-loop reviews and group cloud deployment.
          - Cloud baseline gap: the AI recommendation route still needs an explicit OFF gate.
          EOF

      # ---------------------------------------------------
      # 13. Clean up only Checklist CI resources
      # ---------------------------------------------------
      - name: Stop Checklist services
        if: always()
        run: |
          docker rm -f \
            "$FRONTEND_CONTAINER" \
            "$BACKEND_CONTAINER" \
            "$DATABASE_CONTAINER" \
            2>/dev/null || true

          docker network rm "$CHECKLIST_NETWORK" 2>/dev/null || true
