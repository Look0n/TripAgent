name: Account Profile Service CI

on:
  push:
    branches:
      - main
    paths:
      - "student-25992405/**"
      - "docker-compose.yml"
      - ".github/workflows/student-25992405-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "student-25992405/**"
      - "docker-compose.yml"
      - ".github/workflows/student-25992405-ci.yml"


jobs:
  account-service-ci:
    name: Test Account Profile Service
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ---------------------------------------------------
      # 2. Set up Python
      # ---------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ---------------------------------------------------
      # 3. Check Python syntax
      # ---------------------------------------------------

      - name: Check backend Python syntax
        run: |
          python -m compileall student-25992405/account-backend


      - name: Check database Python syntax
        run: |
          python -m compileall student-25992405/account-database


      # ---------------------------------------------------
      # 4. Validate Docker Compose
      # ---------------------------------------------------

      - name: Validate Docker Compose
        run: |
          docker compose config


      # ---------------------------------------------------
      # 5. Build Account/Profile containers
      # ---------------------------------------------------

      - name: Build Account Profile services
        run: |
          docker compose build account-database account-backend account-frontend


      # ---------------------------------------------------
      # 6. Start Account/Profile services
      # ---------------------------------------------------

      - name: Start Account Profile services
        run: |
          docker compose up -d account-database account-backend account-frontend


      # ---------------------------------------------------
      # 7. Show container status
      # ---------------------------------------------------

      - name: Show Docker containers
        run: |
          docker compose ps


      # ---------------------------------------------------
      # 8. Wait for database
      # ---------------------------------------------------

      - name: Wait for Account Database
        run: |
          for i in {1..30}; do

            if curl --fail --silent http://localhost:6001/health; then
              echo ""
              echo "Account database is healthy."
              exit 0
            fi

            echo "Waiting for account database..."
            sleep 2

          done

          echo "Account database failed to become healthy."
          docker compose logs account-database
          exit 1


      # ---------------------------------------------------
      # 9. Wait for backend
      # ---------------------------------------------------

      - name: Wait for Account Backend
        run: |
          for i in {1..30}; do

            if curl --fail --silent http://localhost:5001/health; then
              echo ""
              echo "Account backend is healthy."
              exit 0
            fi

            echo "Waiting for account backend..."
            sleep 2

          done

          echo "Account backend failed to become healthy."
          docker compose logs account-backend
          exit 1


      # ---------------------------------------------------
      # 10. Check frontend
      # ---------------------------------------------------

      - name: Check Account Frontend
        run: |
          curl --fail http://localhost:3001/account/login


      # ---------------------------------------------------
      # 11. Verify seed data
      # ---------------------------------------------------

      - name: Verify database seed records
        run: |
          CUSTOMER_COUNT=$(docker compose exec -T account-database \
            python -c "import sqlite3; conn=sqlite3.connect('/data/account.db'); print(conn.execute('SELECT COUNT(*) FROM customer').fetchone()[0])")

          PREFERENCE_COUNT=$(docker compose exec -T account-database \
            python -c "import sqlite3; conn=sqlite3.connect('/data/account.db'); print(conn.execute('SELECT COUNT(*) FROM preference').fetchone()[0])")

          echo "Customer records: $CUSTOMER_COUNT"
          echo "Preference records: $PREFERENCE_COUNT"

          if [ "$CUSTOMER_COUNT" -lt 10 ]; then
            echo "Expected at least 10 customer records."
            exit 1
          fi

          if [ "$PREFERENCE_COUNT" -lt 10 ]; then
            echo "Expected at least 10 preference records."
            exit 1
          fi


      # ---------------------------------------------------
      # 12. Test seeded login
      # ---------------------------------------------------

      - name: Test seeded customer login
        run: |
          curl --fail \
            --cookie-jar cookies.txt \
            --header "Content-Type: application/json" \
            --data '{
              "email": "alice@example.com",
              "password": "TripAgent123!"
            }' \
            http://localhost:5001/api/account/login


      # ---------------------------------------------------
      # 13. Test authenticated profile request
      # ---------------------------------------------------

      - name: Test customer profile
        run: |
          curl --fail \
            --cookie cookies.txt \
            http://localhost:5001/api/account/profile


      # ---------------------------------------------------
      # 14. Display logs if something failed
      # ---------------------------------------------------

      - name: Show Docker logs on failure
        if: failure()
        run: |
          docker compose logs account-database
          docker compose logs account-backend
          docker compose logs account-frontend


      # ---------------------------------------------------
      # 15. Clean up
      # ---------------------------------------------------

      - name: Stop Account Profile services
        if: always()
        run: |
          docker compose down -v