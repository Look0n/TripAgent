name: Student 5 - Flight Service CI

on:
  push:
    branches:
      - main
      - student-5-flight-service
    paths:
      - 'student-25487036/**'
      - '.github/workflows/student-5.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'student-25487036/**'
      - '.github/workflows/student-5.yml'
  workflow_dispatch:

jobs:

  validate-services:
    name: Build and validate flight microservices
    runs-on: ubuntu-latest

    steps:

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install database service dependencies
        run: pip install -r student-25487036/flight-database/requirements.txt

      - name: Install backend service dependencies
        run: pip install -r student-25487036/flight-backend/requirements.txt

      - name: Start flight-database service
        working-directory: student-25487036/flight-database
        env:
          DATABASE_PATH: ./flight.db
        run: |
          python app.py > database.log 2>&1 &
          echo $! > database.pid

      - name: Wait for flight-database health
        run: |
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:6005/health > /dev/null; then
              echo "flight-database is healthy after ${attempt} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "flight-database did not become healthy"
          cat student-25487036/flight-database/database.log
          exit 1

      - name: Verify database seed data
        run: |
          COUNT=$(curl -sf http://127.0.0.1:6005/flights | python -c "import json,sys; print(len(json.load(sys.stdin)))")
          echo "Flights in database: ${COUNT}"
          if [ "${COUNT}" -lt 10 ]; then
            echo "Expected at least 10 seeded flights, found ${COUNT}"
            exit 1
          fi

      - name: Validate database CRUD operations
        run: |
          echo "Testing GET /flights/1"
          curl -sf http://127.0.0.1:6005/flights/1 > /dev/null

          echo "Testing GET /flights with filters"
          curl -sf "http://127.0.0.1:6005/flights?origin=SYD&destination=MEL" > /dev/null

          echo "Testing POST /flights"
          NEW_ID=$(curl -sf -X POST http://127.0.0.1:6005/flights \
            -H "Content-Type: application/json" \
            -d '{"airline":"CI Airways","origin":"CIX","destination":"CIY","departure_time":"2026-12-01T09:00:00","arrival_time":"2026-12-01T10:30:00","price":199.00,"duration":90,"seat_availability":25}' \
            | python -c "import json,sys; print(json.load(sys.stdin)['flight_id'])")
          echo "Created flight ${NEW_ID}"

          echo "Testing PUT /flights/${NEW_ID}"
          curl -sf -X PUT "http://127.0.0.1:6005/flights/${NEW_ID}" \
            -H "Content-Type: application/json" \
            -d '{"airline":"CI Airways","origin":"CIX","destination":"CIY","departure_time":"2026-12-01T09:00:00","arrival_time":"2026-12-01T11:00:00","price":215.00,"duration":120,"seat_availability":20}' > /dev/null

          echo "Testing DELETE /flights/${NEW_ID}"
          curl -sf -X DELETE "http://127.0.0.1:6005/flights/${NEW_ID}" > /dev/null

          echo "Testing 404 handling"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:6005/flights/999999)
          if [ "${STATUS}" != "404" ]; then
            echo "Expected 404 for missing flight, got ${STATUS}"
            exit 1
          fi

          echo "All CRUD operations validated"

      - name: Start flight-backend service
        working-directory: student-25487036/flight-backend
        env:
          FLIGHT_DATABASE_URL: http://127.0.0.1:6005
          OLLAMA_BASE_URL: http://127.0.0.1:11434/v1
          MCP_ENABLED: "false"
          RAG_ENABLED: "false"
        run: |
          python app.py > backend.log 2>&1 &
          echo $! > backend.pid

      - name: Wait for flight-backend health
        run: |
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5005/health > /dev/null; then
              echo "flight-backend is healthy after ${attempt} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "flight-backend did not become healthy"
          cat student-25487036/flight-backend/backend.log
          exit 1

      - name: Validate backend API integration
        run: |
          echo "Testing backend to database integration"
          curl -sf http://127.0.0.1:5005/api/flight/flights > /dev/null

          echo "Testing filtered search"
          curl -sf "http://127.0.0.1:5005/api/flight/flights?origin=SYD&destination=MEL" > /dev/null

          echo "Testing HTML table endpoint"
          curl -sf http://127.0.0.1:5005/api/flight/flights/html | grep -q "flight-table"

          echo "Testing 404 propagation"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5005/api/flight/flights/999999)
          if [ "${STATUS}" != "404" ]; then
            echo "Expected 404 propagation, got ${STATUS}"
            exit 1
          fi

          echo "Backend integration validated"

      - name: Verify MCP and RAG are disabled during CI
        run: |
          echo "Confirming MCP mode is disabled"
          MCP_MODE=$(curl -sf http://127.0.0.1:5005/api/flight/mcp/mode \
            | python -c "import json,sys; print(json.load(sys.stdin)['enabled'])")
          if [ "${MCP_MODE}" != "False" ]; then
            echo "Expected MCP mode disabled in CI, got ${MCP_MODE}"
            exit 1
          fi

          echo "Confirming RAG mode is disabled"
          RAG_MODE=$(curl -sf http://127.0.0.1:5005/api/flight/rag/mode \
            | python -c "import json,sys; print(json.load(sys.stdin)['enabled'])")
          if [ "${RAG_MODE}" != "False" ]; then
            echo "Expected RAG mode disabled in CI, got ${RAG_MODE}"
            exit 1
          fi

          echo "Confirming MCP integration is retained but refuses calls"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST http://127.0.0.1:5005/api/flight/mcp/call \
            -H "Content-Type: application/json" \
            -d '{"tool":"search_flights","arguments":{"origin":"SYD"}}')
          if [ "${STATUS}" != "503" ]; then
            echo "Expected 503 from disabled MCP, got ${STATUS}"
            exit 1
          fi

          echo "Confirming tool boundaries reject cross-feature tools"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST http://127.0.0.1:5005/api/flight/mcp/call \
            -H "Content-Type: application/json" \
            -d '{"tool":"get_customer_profile","arguments":{"customer_id":1}}')
          if [ "${STATUS}" != "403" ]; then
            echo "Expected 403 for out-of-boundary tool, got ${STATUS}"
            exit 1
          fi

          echo "Confirming RAG integration is retained but refuses calls"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST http://127.0.0.1:5005/api/flight/rag/answer \
            -H "Content-Type: application/json" \
            -d '{"query":"What is the flight service?"}')
          if [ "${STATUS}" != "503" ]; then
            echo "Expected 503 from disabled RAG, got ${STATUS}"
            exit 1
          fi

          echo "MCP and RAG correctly retained and disabled during CI"

      - name: Validate agentic workflow stages
        run: |
          RESPONSE=$(curl -sf -X POST http://127.0.0.1:5005/api/flight/ai/recommend \
            -H "Content-Type: application/json" \
            -d '{"message":"cheapest flight to Melbourne","origin":"SYD","destination":"MEL"}')

          echo "${RESPONSE}" | python -c "
          import json, sys
          data = json.load(sys.stdin)
          for stage in ['plan', 'act', 'observe', 'adapt']:
              assert stage in data, f'Missing agentic stage: {stage}'
          assert data['plan']['priority'] == 'price', 'Plan did not resolve price priority'
          assert data['act']['flights_retrieved'] > 0, 'Act retrieved no flights'
          assert data['observe']['flights_found'] > 0, 'Observe found no flights'
          print('Plan, Act, Observe, Adapt stages all present')
          print('Priority resolved as:', data['plan']['priority'])
          print('Flights retrieved:', data['act']['flights_retrieved'])
          print('AI model available:', data['ai_available'])
          "

      - name: Validate missing message returns 400
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:5005/api/flight/ai/recommend \
            -H "Content-Type: application/json" -d '{}')
          if [ "${STATUS}" != "400" ]; then
            echo "Expected 400 for missing message, got ${STATUS}"
            exit 1
          fi
          echo "Validation error handling confirmed"

      - name: Stop services
        if: always()
        run: |
          if [ -f student-25487036/flight-backend/backend.pid ]; then
            kill "$(cat student-25487036/flight-backend/backend.pid)" || true
          fi
          if [ -f student-25487036/flight-database/database.pid ]; then
            kill "$(cat student-25487036/flight-database/database.pid)" || true
          fi

      - name: Build flight-database image
        run: docker build -f student-25487036/flight-database/Dockerfile -t flight-database:ci student-25487036/flight-database

      - name: Build flight-backend image
        run: docker build -f student-25487036/flight-backend/Dockerfile -t flight-backend:ci student-25487036/flight-backend

      - name: Build flight-frontend image
        run: docker build -f student-25487036/flight-frontend/Dockerfile -t flight-frontend:ci student-25487036/flight-frontend

      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-5-service-logs
          path: |
            student-25487036/flight-database/database.log
            student-25487036/flight-backend/backend.log
          if-no-files-found: ignore