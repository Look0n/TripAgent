services:

  # =================================================
  # SHARED FRONTEND
  # =================================================
  shared-frontend:
    build:
      context: ./shared/frontend

    ports:
      - "3000:80"

    depends_on:
      shared-gateway:
        condition: service_healthy

      account-frontend:
        condition: service_started

    restart: unless-stopped


  # =================================================
  # SHARED GATEWAY
  # =================================================
  shared-gateway:
    build:
      context: ./shared/gateway

    ports:
      - "5000:5000"

    environment:
      SHARED_DATABASE_URL: http://shared-database:6000
      ACCOUNT_BACKEND_URL: http://account-backend:5001

    depends_on:
      shared-database:
        condition: service_healthy

      account-backend:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    restart: unless-stopped


  # =================================================
  # SHARED DATABASE
  # =================================================
  shared-database:
    build:
      context: ./shared/database

    ports:
      - "6000:6000"

    volumes:
      - shared-database-data:/data

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:6000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    restart: unless-stopped


  # =================================================
  # ACCOUNT FRONTEND
  # =================================================
  account-frontend:
    build:
      context: ./student-25992405/account-frontend

    # Optional direct access for debugging:
    # http://localhost:3001
    ports:
      - "3001:80"

    depends_on:
      account-backend:
        condition: service_healthy

    restart: unless-stopped


  # =================================================
  # ACCOUNT BACKEND
  # =================================================
  account-backend:
    build:
      context: ./student-25992405/account-backend

    ports:
      - "5001:5001"

    environment:
      ACCOUNT_DATABASE_URL: http://account-database:6001
      OLLAMA_URL: http://ollama:11434

    depends_on:
      account-database:
        condition: service_healthy

      ollama:
        condition: service_started

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    restart: unless-stopped


  # =================================================
  # ACCOUNT DATABASE
  # =================================================
  account-database:
    build:
      context: ./student-25992405/account-database

    ports:
      - "6001:6001"

    volumes:
      - account-database-data:/data

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:6001/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    restart: unless-stopped


  flight-frontend:
    build:
      context: ./student-5/flight-frontend
    ports:
      - "3005:80"
    depends_on:
      flight-backend:
        condition: service_healthy
    restart: unless-stopped

  flight-backend:
    build:
      context: ./student-5/flight-backend
    ports:
      - "5005:5005"
    environment:
      FLIGHT_DATABASE_URL: http://flight-database:6005
      OLLAMA_BASE_URL: http://ollama:11434/v1
      OLLAMA_MODEL: qwen2.5:0.5b
    depends_on:
      flight-database:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5005/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  flight-database:
    build:
      context: ./student-5/flight-database
    ports:
      - "6005:6005"
    volumes:
      - flight-database-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6005/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped


  # =================================================
  # OLLAMA
  # =================================================
  ollama:
    image: ollama/ollama:latest

    ports:
      - "11434:11434"

    volumes:
      - ollama-data:/root/.ollama

    restart: unless-stopped


# ===================================================
# VOLUMES
# ===================================================
volumes:

  shared-database-data:

  account-database-data:

  ollama-data:

  flight-database-data: