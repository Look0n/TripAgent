services:

  # =================================================
  # SHARED FRONTEND
  # =================================================
  shared-frontend:
    build:
      context: ./shared/frontend

    ports:
      - "3000:80"

    depends_on:
      shared-gateway:
        condition: service_healthy

      account-frontend:
        condition: service_started

      accommodation-frontend:
        condition: service_healthy

      attractions-frontend:
        condition: service_healthy

      flight-frontend:
        condition: service_started

    restart: unless-stopped


  # =================================================
  # SHARED GATEWAY
  # =================================================
  shared-gateway:
    build:
      context: ./shared/gateway

    ports:
      - "5000:5000"

    environment:
      SHARED_DATABASE_URL: http://shared-database:6000
      ACCOUNT_BACKEND_URL: http://account-backend:5001
      ACCOMMODATION_BACKEND_URL: http://accommodation-backend:5002
      ATTRACTIONS_BACKEND_URL: http://attractions-backend:5003
      FLIGHT_BACKEND_URL: http://flight-backend:5005

    depends_on:
      shared-database:
        condition: service_healthy

      account-backend:
        condition: service_healthy

      accommodation-backend:
        condition: service_healthy

      attractions-backend:
        condition: service_healthy

      flight-backend:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    restart: unless-stopped


  # =================================================
  # SHARED DATABASE
  # =================================================
  shared-database:
    build:
      context: ./shared/database

    ports:
      - "6000:6000"

    volumes:
      - shared-database-data:/data

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:6000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    restart: unless-stopped


  # =================================================
  # ACCOUNT FRONTEND
  # =================================================
  account-frontend:
    build:
      context: ./student-25992405/account-frontend

    ports:
      - "3001:80"

    depends_on:
      account-backend:
        condition: service_healthy

    restart: unless-stopped


  # =================================================
  # ACCOUNT BACKEND
  # =================================================
  account-backend:
    build:
      context: ./student-25992405/account-backend

    ports:
      - "5001:5001"

    environment:
      ACCOUNT_DATABASE_URL: http://account-database:6001
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_DEFAULT_MODEL}

    depends_on:
      account-database:
        condition: service_healthy

      ollama:
        condition: service_started

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    restart: unless-stopped


  # =================================================
  # ACCOUNT DATABASE
  # =================================================
  account-database:
    build:
      context: ./student-25992405/account-database

    ports:
      - "6001:6001"

    volumes:
      - account-database-data:/data

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:6001/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    restart: unless-stopped


  # =================================================
  # ACCOMMODATION FRONTEND
  # =================================================
  accommodation-frontend:
    build:
      context: ./student-14649634/accommodation-frontend

    ports:
      - "3002:3002"

    depends_on:
      accommodation-backend:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:3002/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    restart: unless-stopped


  # =================================================
  # ACCOMMODATION BACKEND
  # =================================================
  accommodation-backend:
    build:
      context: ./student-14649634/accommodation-backend

    ports:
      - "5002:5002"

    environment:
      DATABASE_API_URL: http://accommodation-database:6002
      OLLAMA_URL: http://ollama:11434/api/generate
      OLLAMA_MODEL: llama3.1:8b

    depends_on:
      accommodation-database:
        condition: service_healthy

      ollama:
        condition: service_started

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5002/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    restart: unless-stopped


  # =================================================
  # ACCOMMODATION DATABASE
  # =================================================
  accommodation-database:
    build:
      context: ./student-14649634/accommodation-database

    ports:
      - "6002:6002"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:6002/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    restart: unless-stopped


  # =================================================
  # ATTRACTIONS FRONTEND
  # =================================================
  attractions-frontend:
    build:
      context: ./student-25693742/attractions-frontend

    ports:
      - "3003:80"

    depends_on:
      attractions-backend:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:80/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    restart: unless-stopped


  # =================================================
  # ATTRACTIONS BACKEND
  # =================================================
  attractions-backend:
    build:
      context: ./student-25693742/attractions-backend

    ports:
      - "5003:5003"

    environment:
      DATABASE_API_URL: http://attractions-database:6003
      OLLAMA_URL: http://ollama:11434/api/generate
      OLLAMA_MODEL: qwen2.5:0.5b

    depends_on:
      attractions-database:
        condition: service_healthy

      ollama:
        condition: service_started

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5003/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    restart: unless-stopped


  # =================================================
  # ATTRACTIONS DATABASE
  # =================================================
  attractions-database:
    build:
      context: ./student-25693742/attractions-database

    ports:
      - "6003:6003"

    volumes:
      - attractions-database-data:/data

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:6003/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    restart: unless-stopped


  # =================================================
  # FLIGHT FRONTEND
  # =================================================
  flight-frontend:
    build:
      context: ./student-25487036/flight-frontend

    ports:
      - "3005:80"

    depends_on:
      flight-backend:
        condition: service_healthy

    restart: unless-stopped


  # =================================================
  # FLIGHT BACKEND
  # =================================================
  flight-backend:
    build:
      context: ./student-25487036/flight-backend

    ports:
      - "5005:5005"

    environment:
      FLIGHT_DATABASE_URL: http://flight-database:6005
      OLLAMA_BASE_URL: http://ollama:11434/v1
      OLLAMA_MODEL: qwen2.5:0.5b

    depends_on:
      flight-database:
        condition: service_healthy

      ollama:
        condition: service_started

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5005/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    restart: unless-stopped


  # =================================================
  # FLIGHT DATABASE
  # =================================================
  flight-database:
    build:
      context: ./student-25487036/flight-database

    ports:
      - "6005:6005"

    volumes:
      - flight-database-data:/data

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:6005/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    restart: unless-stopped


  # =================================================
  # OLLAMA
  # =================================================
  ollama:
    image: ollama/ollama:latest

    ports:
      - "11434:11434"

    volumes:
      - ollama-data:/root/.ollama

    restart: unless-stopped


  # =================================================
  # OLLAMA MODEL INITIALISATION
  # =================================================
  ollama-init:
    image: ollama/ollama:latest

    environment:
      OLLAMA_HOST: http://ollama:11434

    depends_on:
      ollama:
        condition: service_started

    entrypoint: /bin/sh

    command:
      - -c
      - |
        echo "Waiting for Ollama..."

        until ollama list > /dev/null 2>&1; do
          sleep 2
        done

        echo "Ensuring qwen2.5:0.5b is available..."
        ollama pull qwen2.5:0.5b

        echo "Ensuring llama3.1:8b is available..."
        ollama pull llama3.1:8b

        echo "Ollama models are ready."


# ===================================================
# VOLUMES
# ===================================================
volumes:

  shared-database-data:

  account-database-data:

  attractions-database-data:

  flight-database-data:

  ollama-data: