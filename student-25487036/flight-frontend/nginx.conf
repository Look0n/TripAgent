server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    absolute_redirect off;

    location = / {
        return 302 /flight;
    }

    location = /flight {
        return 302 /flight/search;
    }

    location = /flight/search {
        try_files /search.html =404;
    }

    location = /flight/manage {
        try_files /manage.html =404;
    }

    location /flight/css/ {
        alias /usr/share/nginx/html/css/;
    }


}
